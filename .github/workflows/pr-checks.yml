# Automatic checks on every pull request (and on main after a merge).
# They run the same checks AGENTS.md asks every agent to run before opening a PR, so the owner sees a
# green check (or a clear failure) on the PR before merging. Read-only: nothing here deploys or uses secrets.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Lint, types, tests, build, compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Type check (generates Next.js route types first)
        run: npx next typegen && npx tsc --noEmit
      - name: Tests (pricing, lead route, per-square guard)
        run: node --test tests/*.mjs
      - name: Production build (includes the Illinois and page-length guards)
        run: npx next build
      - name: Compliance scan (Illinois rule, claims, whole-roof pricing)
        run: node scripts/compliance-scan.mjs
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Lead form browser tests (desktop + phone; /api/lead is mocked, nothing is saved)
        run: npx playwright test
      - name: Keep the browser test trace if a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse (report only, never blocks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build
        run: npx next build
      - name: Lighthouse on the homepage, a roofing page and an Illinois page
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Lighthouse scores
        if: always()
        run: |
          node -e 'const m=require("./lighthouse-reports/manifest.json");for(const r of m){const s=r.summary;console.log(r.url.replace("http://localhost:3300","")||"/","| performance",Math.round(s.performance*100),"| accessibility",Math.round(s.accessibility*100),"| best practices",Math.round(s["best-practices"]*100),"| SEO",Math.round(s.seo*100))}'
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan new commits for keys, tokens and passwords (gitleaks)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --no-banner --redact --log-opts="$RANGE"
